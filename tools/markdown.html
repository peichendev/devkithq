<meta name="description" content="Free online Markdown editor with live preview. GitHub Flavored Markdown support. Split-pane editing. All browser-based, privacy-first.">

<link rel="stylesheet" href="../css/global.css">
<style>
  .md-wrap{display:flex;gap:0;max-width:100%;margin:0 auto;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;min-height:calc(100vh - 280px)}
  .md-pane{flex:1;min-width:0;display:flex;flex-direction:column}
  .md-pane-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bg-elevated);border-bottom:1px solid var(--border);font-size:var(--fs-xs);font-weight:600;color:var(--text-secondary);flex-shrink:0}
  .md-pane-header .badge{font-size:10px;padding:2px 8px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;color:var(--text-tertiary)}
  .md-editor{border:none!important;border-radius:0!important;resize:none;flex:1;min-height:400px;padding:20px;font-family:var(--font-mono);font-size:var(--fs-sm);line-height:1.7;background:var(--bg);color:var(--text);outline:none;overflow-y:auto}
  .md-editor:focus{box-shadow:none}
  .md-preview{flex:1;padding:20px 24px;overflow-y:auto;line-height:1.75;font-size:var(--fs-base)}
  .md-divider{width:1px;background:var(--border);flex-shrink:0}
  .md-preview h1,.md-preview h2,.md-preview h3,.md-preview h4{line-height:1.3;margin-top:1.2em;margin-bottom:0.5em;font-weight:700;letter-spacing:-0.02em}
  .md-preview h1{font-size:1.6em;border-bottom:1px solid var(--border);padding-bottom:0.3em}
  .md-preview h2{font-size:1.35em;border-bottom:1px solid var(--border);padding-bottom:0.25em}
  .md-preview h3{font-size:1.15em}
  .md-preview p{margin-bottom:0.8em}
  .md-preview code{background:var(--bg-card);padding:2px 6px;border-radius:4px;font-family:var(--font-mono);font-size:0.88em}
  .md-preview pre{background:#1a1a1e;border:1px solid var(--border);border-radius:var(--radius);padding:16px;overflow-x:auto;margin-bottom:1em}
  .md-preview pre code{background:none;padding:0;font-size:var(--fs-sm)}
  [data-theme="light"] .md-preview pre{background:#f0f0f2}
  .md-preview blockquote{border-left:3px solid var(--accent);padding:4px 16px;margin:1em 0;color:var(--text-secondary)}
  .md-preview table{border-collapse:collapse;width:100%;margin-bottom:1em}
  .md-preview th,.md-preview td{border:1px solid var(--border);padding:8px 12px;text-align:left;font-size:var(--fs-sm)}
  .md-preview th{background:var(--bg-card);font-weight:600}
  .md-preview img{max-width:100%;border-radius:var(--radius)}
  .md-preview ul,.md-preview ol{padding-left:1.5em;margin-bottom:0.8em}
  .md-preview li{margin-bottom:4px}
  .md-preview a{color:var(--accent)}
  .md-preview hr{border:none;border-top:1px solid var(--border);margin:1.5em 0}
  .md-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:0}
  .md-toolbar .spacer{flex:1}
  .md-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary);font-size:var(--fs-sm);flex-direction:column;gap:12px}
  .md-empty svg{opacity:0.3}
  @media(max-width:768px){
    .md-wrap{flex-direction:column;min-height:auto}
    .md-divider{width:100%;height:1px}
    .md-editor{min-height:300px}
    .md-preview{min-height:300px}
  }

.bg-demo{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.15}
.bg-demo .md{position:absolute;font-family:var(--font-mono);animation:bgMd 8s ease-in-out infinite}
.bg-demo .md .syntax{color:rgba(168,85,247,0.5);font-weight:700}
.bg-demo .md .text{color:rgba(168,85,247,0.25)}
.bg-demo .m1{top:12%;left:8%;font-size:22px;animation-delay:0s}
.bg-demo .m2{top:28%;right:10%;font-size:16px;animation-delay:-1.5s}
.bg-demo .m3{top:48%;left:12%;font-size:14px;animation-delay:-3s}
.bg-demo .m4{bottom:20%;right:12%;font-size:18px;animation-delay:-4.5s}
.bg-demo .m5{top:65%;left:40%;font-size:15px;animation-delay:-6s}
@keyframes bgMd{0%,100%{opacity:0.25;transform:translateY(0)}50%{opacity:0.6;transform:translateY(-14px)}}
.bg-demo .sym{position:absolute;font-family:var(--font-mono);font-weight:700;color:rgba(168,85,247,0.4);animation:bgSym 8s ease-in-out infinite}
.bg-demo .s1{top:8%;left:10%;font-size:52px;animation-delay:0s}
.bg-demo .s2{top:20%;right:12%;font-size:38px;animation-delay:-1s}
.bg-demo .s3{top:45%;left:8%;font-size:44px;animation-delay:-2s}
.bg-demo .s4{top:60%;right:8%;font-size:34px;animation-delay:-3s}
.bg-demo .s5{bottom:12%;left:20%;font-size:48px;animation-delay:-4s}
.bg-demo .s6{top:15%;left:55%;font-size:30px;animation-delay:-5s}
.bg-demo .s7{top:70%;right:30%;font-size:40px;animation-delay:-6s}
.bg-demo .s8{bottom:20%;right:50%;font-size:28px;animation-delay:-7s}
@keyframes bgSym{0%,100%{opacity:0.15;transform:translateY(0)}50%{opacity:0.5;transform:translateY(-18px)}}

</style>
</head>
<body>
<div class="bg-demo"><div class="md m1"><span class="syntax">#</span> <span class="text">DevKit HQ</span></div><div class="md m2"><span class="syntax">**</span><span class="text">隐私优先</span><span class="syntax">**</span></div><div class="md m3"><span class="syntax">-</span> <span class="text">浏览器本地处理</span></div><div class="md m4"><span class="syntax">></span> <span class="text">数据不上传服务器</span></div><div class="md m5"><span class="syntax">~~</span><span class="text">旧方案</span><span class="syntax">~~</span> <span class="text">新方案</span></div></div>

<nav class="nav" id="nav"></nav>

<main class="container" style="max-width:100%;padding:0 16px">
  <div class="page-header" style="padding:32px 0 20px">
    <h1><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:8px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><polyline points="8 10 10 8 12 10"/></svg> <span data-i="toolMarkdown">Markdown 预览</span></h1>
    <p data-i="taglineMarkdown">实时编辑预览 Markdown，支持 GitHub Flavored Markdown</p>
  </div>

  <div class="md-toolbar" style="max-width:1100px;margin:0 auto 12px;padding:0 8px">
    <button class="btn btn-secondary btn-sm" id="copyBtn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <span data-i="mdCopy">复制 Markdown</span>
    </button>
    <button class="btn btn-ghost btn-sm" id="clearBtn"><span data-i="mdClear">清空</span></button>
    <button class="btn btn-ghost btn-sm" id="sampleBtn"><span data-i="mdSample">加载示例</span></button>
    <span class="spacer"></span>
    <span style="font-size:var(--fs-xs);color:var(--text-tertiary)" data-i="mdGfmHint">支持 GFM 语法</span>
  </div>

  <div class="md-wrap">
    <!-- Editor pane -->
    <div class="md-pane">
      <div class="md-pane-header">
        <span data-i="mdEditorLabel">Markdown</span>
        <span class="badge" data-i="mdEditorBadge">编辑</span>
      </div>
      <textarea class="md-editor" id="editor" data-i-placeholder="mdEditorPlaceholder" placeholder="# 在此输入 Markdown..."></textarea>
    </div>

    <div class="md-divider"></div>

    <!-- Preview pane -->
    <div class="md-pane">
      <div class="md-pane-header">
        <span data-i="mdPreviewLabel">Preview</span>
        <span class="badge" data-i="mdPreviewBadge">预览</span>
      </div>
      <div class="md-preview" id="preview">
        <div class="md-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="16 13 8 13"/><polyline points="16 17 8 17"/></svg>
          <span data-i="mdEmptyState">在左侧输入 Markdown，这里实时预览</span>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer" data-i="footer" style="margin-top:32px">© 2026 DevKit HQ · 所有工具均在浏览器本地运行 · 隐私安全</footer>
<div class="toast" id="toast"></div>

<script src="../js/shared.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderNav('dev');
  applyI18n();

  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');

  // Configure marked
  if (typeof marked !== 'undefined') {
    marked.setOptions({
      gfm: true,
      breaks: true
    });
  }

  const defaultMd = `# DevKit HQ — Markdown Preview

欢迎使用 **Markdown 实时预览**工具。

## 功能演示

### 代码高亮

\`\`\`javascript
function greet(name) {
  return \`Hello, \${name}!\`;
}
console.log(greet('DevKit'));
\`\`\`

### 表格

| 工具 | 分类 | 状态 |
|------|------|------|
| JSON 格式化 | 开发 | ✅ |
| Base64 编解码 | 开发 | ✅ |
| 图片压缩 | 图片 | ✅ |

### 其他特性

- **粗体** 和 *斜体* 和 ~~删除线~~
- 链接: [DevKit HQ](https://devkithq.cn)
- 引用:

> 所有处理在浏览器本地完成
> 隐私优先，数据不上传服务器

---

在左边编辑，右边实时预览 ✨
`;

  function render() {
    const md = editor.value;
    if (!md.trim()) {
      preview.innerHTML = `<div class="md-empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="16 13 8 13"/><polyline points="16 17 8 17"/></svg>
        <span data-i="mdEmptyState">在左侧输入 Markdown，这里实时预览</span>
      </div>`;
      return;
    }
    try {
      preview.innerHTML = marked.parse(md);
    } catch (e) {
      preview.innerHTML = `<div style="color:var(--red)">渲染错误: ${e.message}</div>`;
    }
  }

  // Debounced live preview
  const debouncedRender = debounce(render, 200);
  editor.addEventListener('input', debouncedRender);

  // Load sample
  document.getElementById('sampleBtn').addEventListener('click', () => {
    editor.value = defaultMd;
    render();
  });

  // Clear
  document.getElementById('clearBtn').addEventListener('click', () => {
    editor.value = '';
    render();
  });

  // Copy
  document.getElementById('copyBtn').addEventListener('click', () => {
    if (editor.value) { copyToClipboard(editor.value); } else { toast(t('noContentToCopy')); }
  });

  // Tab key support in textarea
  editor.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = this.selectionStart;
      const end = this.selectionEnd;
      this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = start + 2;
      debouncedRender();
    }
  });

  // Load sample on first visit
  if (!editor.value) {
    editor.value = defaultMd;
    render();
  }
});
</script>
</body>
</html>
